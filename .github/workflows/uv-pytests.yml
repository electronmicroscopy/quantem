name: PyTests

on:
  pull_request:
  workflow_dispatch:

jobs:
  uv-pytests:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Test other OSs main branch PRs
        os: ${{ github.base_ref == 'main' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --group test

      # -n logical, not auto: auto counts physical cores, 2 on GitHub's 4-vCPU runners.
      # tests/conftest.py gives each worker cores // workers torch and BLAS threads.
      # Tests marked slow run only on pull requests into main, that is once per release.
      - name: Run pytests
        run: uv run pytest tests -n logical --dist loadscope ${{ github.base_ref == 'main' && '--runslow' || '' }}
